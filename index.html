
<!DOCTYPE html>
<html>
<head>
    <title>Script Hub</title>
</head>
<body>
    <h2>Script Roblox</h2>

    <textarea id="script" rows="10" cols="60">
loadstring(game:HttpGet("https://raw.githubusercontent.com/tzeae/rblx/refs/heads/main/main-obfuscated.lua"))()
    </textarea>

    <br><br>

    <button onclick="copyScript()">Copy Script</button>

    <script>

            text.select();
            navigator.clipboard.writeText(text.value);
            alert("Đã copy!");
        }
